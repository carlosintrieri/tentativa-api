name: CI — EnviroSense
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    name: Backend (Node.js + Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Instalar dependências
        working-directory: ./backend
        run: npm install
      - name: Verificar sintaxe (node --check)
        working-directory: ./backend
        run: node --check server.js
      - name: Testes unitários
        working-directory: ./backend
        run: npm test

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Instalar dependências
        working-directory: ./frontend
        run: npm install
      - name: Build do projeto
        working-directory: ./frontend
        env:
          VITE_API_URL: https://envirosense-api-fnaqcgh2gaf4fhcg.centralus-01.azurewebsites.net
        run: npm run build

  deploy:
    name: Deploy no Azure
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências do backend
        working-directory: ./backend
        run: npm install --production

      - name: Build do frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://envirosense-api-fnaqcgh2gaf4fhcg.centralus-01.azurewebsites.net
        run: npm install && npm run build

      - name: Deploy no Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: envirosense-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
