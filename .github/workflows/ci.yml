# ci.yml — integração contínua seguindo Martin Fowler
# roda automaticamente a cada push no branch main

name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v3

      # configura o Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # instala dependências do backend
      - name: Instalar dependências do backend
        run: cd backend && npm install

      # roda os 20 testes unitários
      # fowler: make the build self-testing
      # se qualquer teste falhar o pipeline para — nenhum código quebrado chega ao Azure
      - name: Testes unitários
        run: cd backend && npm test

      # instala dependências do frontend
      - name: Instalar dependências do frontend
        run: cd frontend && npm install

      # compila o React
      # fowler: automate the build — sem intervenção manual
      - name: Build do frontend
        run: cd frontend && npm run build
