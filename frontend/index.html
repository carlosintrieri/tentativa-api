<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnviroSense</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
      body { background: #f8f9fa; }
      .btn, .btn:hover, .btn:focus, .btn:active, .btn:focus-visible {
        box-shadow: none !important; outline: none !important; transition: none !important;
      }
      .btn-success, .btn-success:hover, .btn-success:focus, .btn-success:active {
        background-color: #146c43 !important; color: #ffffff !important; border: none !important;
      }
      .btn-secondary, .btn-secondary:hover, .btn-secondary:focus {
        background-color: #6c757d !important; color: #ffffff !important; border: none !important;
      }
      .btn-outline-secondary, .btn-outline-secondary:hover, .btn-outline-secondary:focus,
      .btn-outline-danger, .btn-outline-danger:hover, .btn-outline-danger:focus,
      .btn-outline-success, .btn-outline-success:hover, .btn-outline-success:focus {
        border: none !important; background-color: transparent !important; color: inherit !important;
      }
      nav .btn { border: none !important; background: transparent !important; color: #ffffff !important; }
      nav .btn-light { color: #146c43 !important; background-color: #ffffff !important; }
      .table-hover > tbody > tr:hover > * { background-color: transparent !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
